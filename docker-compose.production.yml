services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bai_prod
      POSTGRES_USER: bai_prod
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - bai_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bai_prod -d bai_prod"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env.production}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:4000/ready"]
      interval: 10s
      timeout: 5s
      retries: 12

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env.production}
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_URL: ${PUBLIC_API_URL}
    restart: unless-stopped
    ports:
      - "8080:80"

volumes:
  bai_prod_data:
